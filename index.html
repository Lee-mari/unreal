<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=1100"><title>mari · sky islands</title><style>body{margin:0}.page{margin:0 auto}</style></head><body><link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0}

.panel{background:#fff;border:1.6px solid var(--ink);border-radius:24px;padding:22px 22px 20px;box-shadow:6px 6px 0 var(--pink)}
.panel .pk{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.16em;color:var(--muted)}
.panel h3{font-family:"Gowun Batang",serif;font-weight:700;font-size:26px;margin:6px 0 4px}
.panel .pm{font-size:12.5px;color:var(--muted);line-height:19px}
.panel p{font-size:14px;line-height:23px;margin:12px 0 10px}
.panel ul{list-style:none;border-top:1.2px dashed #d9cbe8;padding-top:8px}
.panel li{font-size:13.5px;padding:4px 0}
.panel li::before{content:"✦ ";color:var(--pink)}
.pb{margin-top:14px;width:100%;background:var(--ink)!important;color:#fff!important;border-radius:999px;padding:11px;font-size:13.5px;box-shadow:0 3px 0 #3d3153}
.pb.dis{background:#cfc3e0!important;box-shadow:none}
.chip{display:inline-block;background:#fff;border:1.4px solid var(--ink);border-radius:999px;padding:5px 14px;font-size:13px;margin:4px}
.lk{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1.2px dashed #d9cbe8;font-size:13px}
.lk b{font-weight:400;font-family:"IBM Plex Mono";font-size:12px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;margin-top:30px;padding:16px 4px 4px;border-top:1.6px solid var(--ink);font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.1em}
.nav{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px}
.nav .lg{font-family:Parisienne;font-size:34px}
.nav .ln{display:flex;gap:22px;font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.14em}
.shd{text-align:center}
.shd .scr{font-size:72px;line-height:1}
.shd .mono{font-size:10.5px;letter-spacing:.2em;color:var(--muted);margin-top:4px}


.bpw{border:1.4px solid var(--ink);border-radius:20px;overflow:hidden;background:#fff}
.bph{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1.4px solid var(--ink);font-family:"IBM Plex Mono";font-size:11px;background:#f7f0fb}
.bp{position:relative;height:560px;background-color:#faf6fd;background-image:radial-gradient(#e6dcf1 1.6px,transparent 2px);background-size:18px 18px}
.bw{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.bw path{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:2.6;stroke-linecap:round}
.bw path.f{stroke-dasharray:1 10;stroke-width:4.5;stroke-opacity:.75;animation:fl 1.1s linear infinite}
.bw path.d{stroke-dasharray:6 6;stroke-width:2;stroke:#b0739a}
@keyframes fl{to{stroke-dashoffset:-22}}
.bn{position:absolute;background:#fff;border:1.4px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 rgba(91,74,122,.15);font-size:12.5px;transition:transform .25s}
.bn:hover{transform:translateY(-3px)}
.bh{display:flex;align-items:center;gap:7px;background:var(--c);border-radius:12px 12px 0 0;border-bottom:1.4px solid var(--ink);padding:6px 10px;font-family:"IBM Plex Mono";font-weight:500;font-size:11px}
.bh em{margin-left:auto;font-style:normal;font-size:9px;letter-spacing:.1em;background:#fff;border:1.2px solid var(--ink);border-radius:999px;padding:0 6px}
.bb{padding:4px 0 6px}
.bt2{display:block;font-family:"Gowun Batang";font-size:18px;padding:2px 10px 0}
.br{display:flex;align-items:center;gap:6px;min-height:22px;padding:0 10px}
.br .sp{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
.mu{color:var(--muted);font-size:11px}
.px{display:inline-block;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid var(--ink);flex:none}
.pd{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc);border:1.4px solid var(--ink);flex:none}
.bc{position:absolute;border:1.6px dashed var(--ink);border-radius:14px;background:rgba(255,245,204,.7);padding:8px 12px;font-size:12px;line-height:18px}

.bc em{font-style:normal;font-family:"IBM Plex Mono";font-size:9.5px;color:#b0739a;margin-right:4px}
.bpl{display:flex;gap:16px;align-items:center;padding:8px 14px;border-top:1.4px solid var(--ink);font-size:11.5px;color:var(--muted);background:#f7f0fb}
.bpl span{display:flex;align-items:center;gap:6px}.bpl .tg{margin-left:auto;font-family:"IBM Plex Mono";font-size:10px}
.md.wide{width:800px;margin-left:-400px}

.hd{display:flex;justify-content:space-between;align-items:flex-start;position:absolute;left:0;right:0;top:0;padding:34px 44px;z-index:3;pointer-events:none}
.hd .ttl{margin-left:-14px}

.hd .hint{margin-top:14px;display:inline-block;background:#fff;border:1.6px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.hd .nav2{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.14em;display:flex;gap:18px;pointer-events:auto}
.map{position:relative;height:1560px;border:1.6px solid var(--ink);border-radius:40px;overflow:hidden;background:linear-gradient(180deg,#d7c9f4 0%,#e7dbfb 20%,#f6d5ec 52%,#fcd6e8 75%,#fde8f0)}
.map>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.trail{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;opacity:.85}
.trail2{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-dasharray:1 10;stroke-linecap:round}
.goal{position:absolute;left:760px;top:420px;font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.24em;color:var(--muted)}
/* hover */
.isl{z-index:1}
.isl:hover{z-index:4}
.isl .art{transition:transform .45s cubic-bezier(.3,1.4,.5,1),filter .35s}
.isl:hover .art{transform:translateY(-14px) scale(1.06);filter:drop-shadow(0 0 10px #fff) drop-shadow(0 18px 24px rgba(91,74,122,.25))}
.isl::before{content:"";position:absolute;left:50%;top:62%;width:70%;height:18px;margin-left:-35%;border-radius:50%;background:rgba(91,74,122,.18);filter:blur(6px);transition:all .45s;z-index:-1}
.isl:hover::before{transform:scale(.8);opacity:.5}
.tip{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%) translateY(8px);opacity:0;pointer-events:none;background:#fff;border:1.6px solid var(--ink);border-radius:16px;padding:8px 14px 9px;white-space:nowrap;box-shadow:0 4px 0 var(--ink);transition:all .3s;text-align:center}
.tip::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;margin-left:-6px;background:#fff;border-right:1.6px solid var(--ink);border-bottom:1.6px solid var(--ink);transform:rotate(45deg)}
.tip small{display:block;font-family:"IBM Plex Mono";font-size:9px;letter-spacing:.14em;color:var(--muted)}
.tip b{font-family:"Gowun Batang";font-size:15px}
.tip em{display:block;font-style:normal;font-size:11px;color:#b0739a;margin-top:2px}
.isl:hover .tip{opacity:1;transform:translate(-50%,-100%)}
.isl .spk{position:absolute;inset:0;pointer-events:none}
.isl .spk i{position:absolute;width:14px;height:14px;opacity:0;background:#fff0b3;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);transition:opacity .3s}
.isl:hover .spk i{opacity:1;animation:tw 1.4s ease-in-out infinite}
.isl .spk i:nth-child(1){left:6%;top:20%}.isl .spk i:nth-child(2){right:4%;top:8%;animation-delay:.4s!important}.isl .spk i:nth-child(3){right:14%;top:44%;animation-delay:.8s!important;width:10px;height:10px}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(91,74,122,.35);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.show{opacity:1;pointer-events:auto}
.ov.abs{position:absolute}
.md{position:absolute;left:50%;width:780px;margin-left:-390px;background:#fffafc;border:1.6px solid var(--ink);border-radius:32px;overflow:hidden;box-shadow:10px 10px 0 var(--pink),0 40px 80px -30px rgba(60,40,90,.5);transform:translateY(24px) scale(.94);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.ov.show .md{transform:none}
.ov:not(.abs) .md{top:50%;transform:translateY(-50%) scale(.94)}.ov.show:not(.abs) .md{transform:translateY(-50%)}
.mh{position:relative;height:230px;background:linear-gradient(180deg,#e3d6fa,#fcd6e8);border-bottom:1.6px solid var(--ink);overflow:hidden}
.mh svg.bg{position:absolute;inset:0;width:100%;height:100%}

.mh .tx{position:absolute;left:36px;bottom:30px}
.mh .k{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.16em;background:#fff;border:1.4px solid var(--ink);border-radius:999px;padding:3px 10px;display:inline-block}
.mh h2{font-family:"Gowun Batang";font-weight:700;font-size:40px;margin-top:10px}
.mh .m{font-size:13px;color:var(--muted);margin-top:2px;max-width:380px}
.x{position:absolute;right:18px;top:16px;z-index:2;width:38px;height:38px;border-radius:50%;background:#fff;border:1.6px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:16px}
.mbd{padding:22px 36px 30px;display:grid;gap:18px}
.mblk h4{font-family:"IBM Plex Mono";font-weight:500;font-size:10.5px;letter-spacing:.18em;color:var(--muted);margin-bottom:8px}
.mp{font-size:14.5px;line-height:25px}
.ml{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}.ml li{font-size:14px}.ml li::before{content:"✦ ";color:var(--pink)}
.roles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.roles div{background:#fff;border:1.4px solid var(--ink);border-radius:16px;padding:10px 10px 12px}
.roles b{display:block;font-family:"Gowun Batang";font-size:17px}.roles span{font-size:11.5px;line-height:16px;color:var(--muted)}
.flow{display:flex;align-items:center;gap:8px}.flow div{flex:1;background:#fff;border:1.4px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:14px;line-height:19px}
.flow small{color:var(--muted);font-size:11.5px}.flow .hot{background:#fde0ec}.flow i{font-style:normal}
.ts{display:grid;grid-template-columns:repeat(3,1fr);border:1.4px solid var(--ink);border-radius:16px;overflow:hidden}
.ts div{padding:12px 14px;font-size:13.5px;line-height:20px;background:#fff}.ts div+div{border-left:1.4px solid var(--ink)}
.ts b{display:block;font-family:"IBM Plex Mono";font-weight:500;font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}.ts .ok{background:#fff5cc}
.pts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pts div{background:#fff;border:1.4px solid var(--ink);border-radius:16px;padding:12px 14px;font-family:"Gowun Batang";font-size:17px}
.pts b{display:block;font-family:"IBM Plex Mono";font-weight:400;font-size:11px;color:var(--pink)}.pts small{display:block;font-family:"Gowun Dodum";font-size:12px;color:var(--muted);margin-top:2px}
.shots{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.shots div{height:96px;border-radius:14px;border:1.4px dashed #c8b6de;display:grid;place-items:center;font-size:12px;color:var(--muted);background:#fff}
.mb{display:flex;gap:10px}.btn{background:#fff;border:1.6px solid var(--ink);border-radius:999px;padding:9px 18px;font-size:13.5px;box-shadow:0 3px 0 var(--ink);cursor:pointer}.btn.p{background:var(--ink);color:#fff}
pre{background:#f4eefb;border-radius:14px;padding:14px 16px;font-family:"IBM Plex Mono";font-size:12.5px;line-height:21px;white-space:pre}
.bars div{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;font-size:13.5px;padding:3px 0}.bars i{height:10px;border-radius:999px;background:#f0e8f8;border:1.2px solid var(--ink);overflow:hidden}.bars b{display:block;height:100%;background:linear-gradient(90deg,#f6a9c9,#a893d6)}
.lks{background:#fff;border:1.4px solid var(--ink);border-radius:16px;padding:4px 16px}
.lockmsg{text-align:center;padding:10px 20px 6px}.lockmsg b{font-family:"Gowun Batang";font-size:22px}.lockmsg p{font-size:14px;line-height:24px;color:var(--muted);margin-top:8px}


/* FPS · game HUD */
.hudx{border:1.4px solid var(--ink);border-radius:20px;background:#2f2745;color:#f5f0ff;padding:14px;display:grid;gap:12px}
.hbar{display:flex;justify-content:space-between;font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.14em;color:#cfc3ee}
.slots5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slots5 div{position:relative;border:1.4px solid #6b5f8f;border-radius:12px;padding:8px 10px 12px;background:#3a3156}
.slots5 div.on{border-color:#ffc8dd;box-shadow:0 0 0 2px rgba(255,200,221,.35)}

.slots5 i{position:absolute;left:10px;bottom:6px;height:3px;border-radius:3px;background:#ffc8dd}
.hrow{display:grid;grid-template-columns:230px 1fr;gap:12px}

.feats{display:grid;gap:8px}
.feats div{background:#3a3156;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.feats b{font-family:"Gowun Batang";font-size:15px}.feats span{font-size:12px;color:#cfc3ee}
.tree pre{background:#3a3156;color:#e8defc;margin-top:8px}
/* Cooking · recipe card */
.recipe{position:relative;background:#fffdf6;border:1.4px solid var(--ink);border-radius:18px;padding:18px 22px;background-image:linear-gradient(transparent 27px,#f3e7d6 28px);background-size:100% 28px}
.rtop{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.6px dashed #e0c9b0;padding-bottom:8px}
.rt{font-family:Parisienne;font-size:34px}.rs{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:10px}
.recipe h5{font-family:"Gowun Batang";font-size:17px;margin-bottom:6px}.recipe h5 small{font-family:Parisienne;font-weight:400;font-size:16px;color:var(--muted);margin-left:4px}
.ing{list-style:none}.ing li{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:4px 0}.ing li::before{content:"○";grid-row:span 2;color:var(--pink)}
.ing b{font-size:14px}.ing span{font-size:11.5px;color:var(--muted);grid-column:2}

.note{margin-top:8px;background:#fff0b3;border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:19px;transform:rotate(-1deg);box-shadow:0 3px 0 rgba(91,74,122,.15)}
.stamp{position:absolute;right:20px;bottom:14px;font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.2em;color:#e07aa3;border:2px solid #e07aa3;border-radius:999px;padding:4px 12px;transform:rotate(-10deg);opacity:.8}
/* Maze · quest board roadmap */
.board{background:#f6ecdc;border:1.4px solid var(--ink);border-radius:18px;padding:16px 18px;background-image:radial-gradient(rgba(91,74,122,.08) 1px,transparent 1.4px);background-size:10px 10px}
.bhd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.bhd b{font-family:"IBM Plex Mono";font-weight:500;letter-spacing:.2em;font-size:12px}

.sh2{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.sh2 b{font-family:"IBM Plex Mono";font-weight:500;letter-spacing:.2em;font-size:12px}.sh2 span{font-size:12px;color:var(--muted)}
.carts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;border-bottom:6px solid #d9c6ec;padding-bottom:6px}

.omap>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.ctr{position:absolute;left:0;right:0;top:330px;text-align:center;pointer-events:none;z-index:2}

<section class="rsx" id="s1"><div class="rh"><span class="rn">01</span><span class="rk">OVERVIEW</span><h3>한눈에 보기</h3></div>
<p class="lead">칸이 6개인 인벤토리를 <b>0번 칸부터 5번 칸까지 하나씩</b> 열어 보고, <b>빈 칸</b>을 찾으면 알려 주는 콘솔 게임이에요.</p>
<div class="facts"><div><small>언어</small>C</div><div><small>화면</small>콘솔</div><div><small>배운 문법</small>for + 배열</div><div><small>작업 시간</small>__시간</div></div>
<div class="fx-pipe"><span style="--d:0s">📦 배열 준비</span><i></i><span style="--d:.6s">🔁 for로 한 칸씩</span><i></i><span style="--d:1.2s">❓ if로 비었나?</span><i></i><span style="--d:1.8s">📢 출력</span></div>
</section>

<section class="rsx" id="s2"><div class="rh"><span class="rn">02</span><span class="rk">LEARNED</span><h3>오늘 배운 문법</h3></div>
<p><b>for 문</b> = <b>정해진 횟수만큼 반복</b>하는 것. “5번 반복해!” 할 때 써요.</p>
<div class="fx-anat"><code class="fx-line">for ( <span class="a1">int i = 1</span>; <span class="a2">i &lt;= 5</span>; <span class="a3">i++</span> )</code>
<div class="fx-parts"><div class="p1"><b>1️⃣ 시작값</b>어디서부터 시작할지<small>딱 한 번만 정해요</small></div><div class="p2"><b>2️⃣ 조건</b>언제까지 반복할지<small>참이면 계속, 거짓이면 끝</small></div><div class="p3"><b>3️⃣ 증감</b>한 바퀴마다 숫자 바꾸기<small>i++ = 1씩 늘리기</small></div></div></div>
<div class="fx-two">
<svg class="fx-ring" viewBox="0 0 300 220" aria-label="for 문이 도는 순서">
<path id="fxTrack" d="M150 40 C230 40 250 110 250 110 C250 110 230 180 150 180 C70 180 50 110 50 110 C50 110 70 40 150 40 Z" fill="none" stroke="#d9cbe8" stroke-width="14" stroke-linecap="round"/>
<path d="M150 40 C230 40 250 110 250 110 C250 110 230 180 150 180 C70 180 50 110 50 110 C50 110 70 40 150 40 Z" fill="none" stroke="#5b4a7a" stroke-width="2" stroke-dasharray="2 8" class="fx-flow"/>
<g font-family="Gowun Dodum" font-size="12.5" fill="#5b4a7a" text-anchor="middle">
<rect x="104" y="24" width="92" height="32" rx="16" fill="#dccbf7" stroke="#5b4a7a" stroke-width="1.4"/><text x="150" y="45">2️⃣ 조건 확인</text>
<rect x="204" y="94" width="92" height="32" rx="10" fill="#fff" stroke="#5b4a7a" stroke-width="1.4"/><text x="250" y="115">반복할 내용</text>
<rect x="104" y="164" width="92" height="32" rx="16" fill="#c6efda" stroke="#5b4a7a" stroke-width="1.4"/><text x="150" y="185">3️⃣ 증감 i++</text>
<rect x="4" y="94" width="92" height="32" rx="16" fill="#fff0b3" stroke="#5b4a7a" stroke-width="1.4"/><text x="50" y="115">다음 바퀴</text>
<text x="150" y="108" font-size="11" fill="#7a6a96">1️⃣ 시작값은</text><text x="150" y="124" font-size="11" fill="#7a6a96">처음 딱 한 번!</text>
</g>
<circle r="7" fill="#e07aa3" stroke="#fff" stroke-width="2"><animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto"><mpath href="#fxTrack"/></animateMotion></circle>
</svg>
<div class="fx-count"><div class="fx-ctop"><span>i =</span><b id="fxI">1</b><em>/ 5 바퀴</em></div><pre id="fxOut"></pre><small>for (int i = 1; i &lt;= 5; i++) printf_s("반복 %d번째!\n", i);</small></div>
</div>
<div class="call">🏃 비유하면 — 운동장 <b>5바퀴 달리기</b>예요. 출발선에 서고(시작값), “5바퀴 다 돌았나?” 확인하고(조건), 한 바퀴 돌 때마다 손가락을 하나씩 접어요(증감).</div>
<div class="call fx-zero">💡 <b>배열 번호는 0부터!</b> 칸이 6개면 번호는 <code>0 ~ 5</code>. 그래서 <code>i = 0</code>에서 시작하고 <code>i &lt; 6</code>까지 돌아요.</div>
</section>

<section class="rsx" id="s3"><div class="rh"><span class="rn">03</span><span class="rk">ARCHITECTURE</span><h3>게임 규칙 · 구조</h3></div>
<ul class="rules"><li><b>1</b> = 아이템 있음</li><li><b>0</b> = 빈 칸</li><li>0번 → 5번 차례로 확인</li><li>0이면 출력</li></ul>
<div class="fx-arch"><div class="fx-archh"><span>main() · 구조도</span><span>점이 흐르는 방향 = 실행 순서</span></div>

<section class="rsx" id="s4"><div class="rh"><span class="rn">04</span><span class="rk">TRACE</span><h3>흐름 따라가기</h3></div>
<p>커서가 칸을 하나씩 열어 봐요. <b>빈 칸(0)</b>을 만나면 반짝! 하고 출력돼요. 아래 표와 다음 장의 코드도 <b>같이 움직여요</b>.</p>
<div class="fx-scan"><div class="fx-shead"><span>INVENTORY SCANNER</span><span id="fxStep">i = 0</span></div>
<div class="fx-slots"><div class="fx-slot" data-v="1"><b>🧪</b><small>0번</small></div><div class="fx-slot" data-v="0"><b></b><small>1번</small></div><div class="fx-slot" data-v="1"><b>🧪</b><small>2번</small></div><div class="fx-slot" data-v="1"><b>🧪</b><small>3번</small></div><div class="fx-slot" data-v="0"><b></b><small>4번</small></div><div class="fx-slot" data-v="1"><b>🧪</b><small>5번</small></div><div class="fx-cur" id="fxCur"><span>i</span></div></div>
<div class="fx-say" id="fxSay">0번 칸 확인 중…</div></div>
<table class="fx-trace"><thead><tr><th>i</th><th>inventory[i]</th><th>== 0 ?</th><th>출력</th></tr></thead><tbody><tr data-r="0"><td>0</td><td>1</td><td>거짓</td><td>—</td></tr><tr data-r="1"><td>1</td><td>0</td><td>참 ✓</td><td>1번 … 비어있어요</td></tr><tr data-r="2"><td>2</td><td>1</td><td>거짓</td><td>—</td></tr><tr data-r="3"><td>3</td><td>1</td><td>거짓</td><td>—</td></tr><tr data-r="4"><td>4</td><td>0</td><td>참 ✓</td><td>4번 … 비어있어요</td></tr><tr data-r="5"><td>5</td><td>1</td><td>거짓</td><td>—</td></tr></tbody></table>
<p class="cap">↑ i가 6이 되면 조건 <code>i &lt; 6</code>이 거짓 → 반복 끝!</p>
</section>

<section class="rsx" id="s5"><div class="rh"><span class="rn">05</span><span class="rk">CODE</span><h3>핵심 코드</h3></div>
<pre class="code fx-code"><span class="ln"><b>#include</b> &lt;stdio.h&gt;</span><span class="ln"></span><span class="ln"><b>int</b> main()</span><span class="ln">{</span><span class="ln" data-l="data">	<b>int</b> inventory[6] = { 1, 0, 1, 1, 0, 1 };   <span class="c">// 1 = 아이템, 0 = 빈 칸</span></span><span class="ln"></span><span class="ln" data-l="for">	<b>for</b> (<b>int</b> i = 0; i &lt; 6; i++)                <span class="c">// 0번 ~ 5번 칸</span></span><span class="ln">	{</span><span class="ln" data-l="if">		<b>if</b> (inventory[i] == 0)               <span class="c">// 비었나?</span></span><span class="ln">		{</span><span class="ln" data-l="print">			printf_s("%d번 아이템은 비어있어요\n", i);</span><span class="ln">		}</span><span class="ln">	}</span><span class="ln" data-l="end">	<b>return</b> 0;</span><span class="ln">}</span></pre>
<p class="cap">↑ 분홍 줄 = 지금 실행 중인 줄. for → if → (비었으면) printf → 다시 for …</p>
</section>

<section class="rsx" id="s6"><div class="rh"><span class="rn">06</span><span class="rk">CHECK</span><h3>주의할 점</h3></div>
<div class="tsx"><div><small>이렇게 쓰면?</small><code>i &lt;= 6</code> 으로 쓰면 7번 돌아요</div><div><small>왜?</small>칸은 <code>0 ~ 5</code>번뿐인데 없는 <code>inventory[6]</code>까지 읽으려 해요 (배열 범위 밖)</div><div class="ok"><small>그래서</small>칸 개수가 6이면 <code>i &lt; 6</code> — “개수보다 작을 때까지”</div></div>
<div class="tsx" style="margin-top:10px"><div><small>발견</small>문제는 “N번 <b>칸</b>은 비어있어요”인데 출력은 “N번 <b>아이템</b>은…”</div><div><small>왜?</small>문장을 옮기면서 단어가 바뀌었어요 — 비어 있는 건 아이템이 아니라 <b>칸</b></div><div class="ok"><small>다음엔</small>출력 문장을 <code>"%d번 칸은 비어있어요"</code>로 맞추기</div></div>
</section>

<section class="rsx" id="s7"><div class="rh"><span class="rn">07</span><span class="rk">PLAY</span><h3>플레이 화면</h3></div>

<p class="cap">실행 캡처 자리 — 실제 캡처로 바꿔 넣기 (위 첫 줄은 이해를 돕기 위한 표시예요)</p>
</section>

<section class="rsx" id="s8"><div class="rh"><span class="rn">08</span><span class="rk">NEXT</span><h3>회고 · 다음 레벨</h3></div>
<div class="retro"><div><b>★ 잘한 점</b><p><b>for(반복)</b>와 <b>if(조건)</b>를 한 코드 안에서 같이 써서, 배열을 한 칸씩 검사했다.</p></div><div><b>▲ 다음엔</b><p>빈 칸이 <b>몇 개</b>인지 세는 변수를 추가해서 “인벤토리 꽉 참!”도 알려 주고 싶다 → LV.03 배열!</p></div></div>
<p class="cap">✎ 회고는 초안이에요 — 내 느낌대로 고쳐 쓰기</p>
</section>

</div></div></template><template id="rd-if01"><div class="rtop2"><span class="bk" data-back>← 미니게임</span><span class="crumb">BONUS / 미니게임 / <b>LV.01 갈림길 게임</b></span><span class="tm">예시 글 · 읽는 데 3분</span></div><div class="r1"><aside><h5>Contents</h5><div class="sm">7 CHAPTERS</div><ol class="toc"><li data-to="s1"><small>CHAPTER 1</small>한눈에 보기</li><li data-to="s2"><small>CHAPTER 2</small>오늘 배운 문법</li><li data-to="s3"><small>CHAPTER 3</small>게임 규칙 · 흐름도</li><li data-to="s4"><small>CHAPTER 4</small>핵심 코드</li><li data-to="s5"><small>CHAPTER 5</small>트러블슈팅</li><li data-to="s6"><small>CHAPTER 6</small>플레이 화면</li><li data-to="s7"><small>CHAPTER 7</small>회고 · 다음 레벨</li></ol><div class="prog"><i></i></div></aside><div class="rsc"><section class="rsx" id="s1"><div class="rh"><span class="rn">01</span><span class="rk">OVERVIEW</span><h3>한눈에 보기</h3></div><p class="lead">if문 하나로 <b>“어느 길로 갈래?”</b>를 묻는 콘솔 게임이에요. 입력한 숫자에 따라 결과가 갈라져요.</p>
<div class="facts"><div><small>언어</small>C++</div><div><small>화면</small>콘솔</div><div><small>배운 문법</small>if / else</div><div><small>작업 시간</small>__시간</div></div></section><section class="rsx" id="s2"><div class="rh"><span class="rn">02</span><span class="rk">LEARNED</span><h3>오늘 배운 문법</h3></div><p>조건이 <b>참</b>이면 첫 번째 길, <b>거짓</b>이면 다음 조건을 확인해요. 전부 아니면 <code>else</code>로 가요.</p>
<div class="call">✎ 비유하면 — 갈림길 표지판을 차례대로 읽는 것과 같아요. 첫 표지판이 맞으면 거기서 멈추고, 아니면 다음 표지판으로!</div></section><section class="rsx" id="s3"><div class="rh"><span class="rn">03</span><span class="rk">FLOW</span><h3>게임 규칙 · 흐름도</h3></div><ul class="rules"><li><b>1</b> 입력 → 보물 발견</li><li><b>2</b> 입력 → 함정</li><li>그 외 → 다시 선택</li></ul><svg class="flowsvg" viewBox="0 0 560 250" aria-label="게임 흐름도">
<g font-family="Gowun Dodum" font-size="13" fill="#5b4a7a" stroke="#5b4a7a" stroke-width="1.5">
<rect x="20" y="100" width="90" height="44" rx="22" fill="#fff0b3"/><text x="65" y="127" text-anchor="middle" stroke="none">시작</text>
<rect x="140" y="100" width="110" height="44" rx="10" fill="#fff"/><text x="195" y="127" text-anchor="middle" stroke="none">숫자 입력</text>
<path d="M300 122 L345 92 L390 122 L345 152 Z" fill="#dccbf7"/><text x="345" y="127" text-anchor="middle" stroke="none" font-size="12">== 1 ?</text>
<rect x="430" y="20" width="110" height="40" rx="10" fill="#c6efda"/><text x="485" y="45" text-anchor="middle" stroke="none">보물 발견!</text>
<path d="M300 212 L345 184 L390 212 L345 240 Z" fill="#dccbf7"/><text x="345" y="217" text-anchor="middle" stroke="none" font-size="12">== 2 ?</text>
<rect x="430" y="192" width="110" height="40" rx="10" fill="#ffc8dd"/><text x="485" y="217" text-anchor="middle" stroke="none">함정이다…</text>
<g fill="none"><path d="M110 122 H140"/><path d="M250 122 H300"/><path d="M345 92 V40 H430"/><path d="M345 152 V184"/><path d="M390 212 H430"/>
<path d="M300 212 H195 V144" stroke-dasharray="4 4"/></g>
<text x="398" y="58" stroke="none" font-size="11">참</text><text x="352" y="172" stroke="none" font-size="11">거짓</text><text x="150" y="178" stroke="none" font-size="11" text-anchor="middle">둘 다 아니면 다시</text>
</g></svg></section><section class="rsx" id="s4"><div class="rh"><span class="rn">04</span><span class="rk">CODE</span><h3>핵심 코드</h3></div><pre class="code"><span class="c">// 갈림길 게임 — 핵심 부분</span>
<b>int</b> choice;
cout &lt;&lt; "동굴 앞 갈림길! 1) 왼쪽  2) 오른쪽 : ";
cin &gt;&gt; choice;

<script>
(function(){
  const INV=[1,0,1,1,0,1];let t1=null,t2=null;
  function stop(){clearInterval(t1);clearInterval(t2);t1=t2=null}
  function start(root){
    stop();
    // (1) i 카운터: 1~5 바퀴
    const I=root.querySelector('#fxI'),O=root.querySelector('#fxOut');let n=0;
    t2=setInterval(()=>{if(!I.isConnected)return stop();n++;if(n>7){n=0;O.innerHTML='';I.textContent='1';return}
      if(n>5)return;I.textContent=n;I.classList.remove('bump');void I.offsetWidth;I.classList.add('bump');
      O.insertAdjacentHTML('beforeend','<span>반복 '+n+'번째!</span>')},800);
    // (2) 스캐너 + 표 + 코드 줄 — 한 박자에 같이 움직여요
    const steps=[{l:'data',i:-1}];
    INV.forEach((v,i)=>{steps.push({l:'for',i});steps.push({l:'if',i});if(v===0)steps.push({l:'print',i})});
    steps.push({l:'for',i:6});steps.push({l:'end',i:6});
    const cur=root.querySelector('#fxCur'),slots=[...root.querySelectorAll('.fx-slot')],rows=[...root.querySelectorAll('.fx-trace tbody tr')],
      lines=[...root.querySelectorAll('.fx-code .ln[data-l]')],say=root.querySelector('#fxSay'),st=root.querySelector('#fxStep');
    let k=0,wait=0;
    function reset(){slots.forEach(s=>s.classList.remove('seen','hit'));rows.forEach(r=>r.classList.remove('now','done','hit'));cur.classList.remove('out');cur.style.transform='translateX(0)'}
    function tick(){
      if(!cur.isConnected)return stop();
      if(wait>0){wait--;if(wait===0){reset();k=0}return}
      const s=steps[k];
      lines.forEach(l=>l.classList.toggle('hot',l.dataset.l===s.l));
      say.classList.remove('hit');
      if(s.l==='data'){reset();say.textContent='📦 인벤토리 준비: 1 0 1 1 0 1';st.textContent='준비'}
      else if(s.i<6){
        const w=slots[0].offsetWidth+10;cur.style.transform='translateX('+(s.i*w)+'px)';st.textContent='i = '+s.i;
        rows.forEach((r,j)=>{r.classList.toggle('now',j===s.i);if(j<s.i)r.classList.add('done')});
        if(s.l==='for')say.textContent='🔁 i = '+s.i+' → i < 6 ? 참! 계속';
        if(s.l==='if'){slots[s.i].classList.add('seen');say.textContent=INV[s.i]?'🧪 '+s.i+'번 칸: 아이템 있음 → 통과':'❓ '+s.i+'번 칸: 0 → 비었어요!'}
        if(s.l==='print'){slots[s.i].classList.add('hit');rows[s.i].classList.add('hit');say.classList.add('hit');say.textContent='📢 "'+s.i+'번 아이템은 비어있어요"'}
      }else{
        rows.forEach(r=>{r.classList.remove('now');r.classList.add('done')});cur.classList.add('out');st.textContent='i = 6';
        say.textContent=s.l==='for'?'🛑 i = 6 → i < 6 ? 거짓 → 반복 끝':'🏁 return 0 · 검사 완료!';
      }
      k++;if(k>=steps.length)wait=4;
    }
    tick();t1=setInterval(tick,900);
  }
  const mbd=document.getElementById('mbd');
  new MutationObserver(()=>{const r=mbd.querySelector('[data-anim="for01"]');if(r)start(r);else stop()}).observe(mbd,{childList:true});
})();
</script>

<section class="rsx" id="a5"><div class="rh"><span class="rn">05</span><span class="rk">TRACE</span><h3>흐름 따라가기</h3></div>
<p>시작 → 3발 쏘기 → R → 한 번 더 R → 끝까지 쏘기 → 빈 탄창에서 클릭 → R … 순서대로 <b>자동 재생</b>돼요. 지금 실행 중인 노드가 반짝여요.</p>
<div class="am-sim am-rv" id="amSim">
<div class="am-simh"><span>BP_Character · 자동 재생</span><span id="amStep">준비</span></div>
<div class="am-simb">
<div class="am-lanes">
<div class="am-lane"><div class="am-n ev" data-n="b0">▶️ BeginPlay</div><i class="am-ar">→</i><div class="am-n set" data-n="b1">🔄 Current = Max</div><i class="am-ar">→</i><div class="am-n pr" data-n="b2">🖨️ Print</div></div>
<div class="am-lane"><div class="am-n ev" data-n="f0">🖱️ 좌클릭</div><i class="am-ar">→</i><div class="am-n q" data-n="f1">❓ Current &gt; 0</div><i class="am-ar">→</i><div class="am-n set" data-n="f2">➖ Current − 1</div><i class="am-ar">→</i><div class="am-n pr" data-n="f3">🖨️ Print</div></div>
<div class="am-alt" data-n="fx">└ False → ⛔ 멈춤 (선이 없으니 아무 일도 안 해요)</div>
<div class="am-lane"><div class="am-n ev" data-n="r0">⌨️ R키</div><i class="am-ar">→</i><div class="am-n q" data-n="r1">❓ Current == Max</div><i class="am-ar">→</i><div class="am-n set" data-n="r2">🔄 Current = Max</div><i class="am-ar">→</i><div class="am-n pr" data-n="r3">🖨️ 장전 완료</div></div>
<div class="am-alt" data-n="r4">└ True → 🖨️ 이미 가득참! (장전 안 함)</div>
</div>
<div class="am-side"><div class="am-hud sm" data-hud="sim"><div class="am-hudt"><span>AMMO</span><b class="am-num">0</b><em>/ 10</em></div><div class="am-pips"></div><div class="am-act">—</div></div>
<div class="am-log"><div class="am-logh">Print String</div><div class="am-logb" id="amLog"></div></div></div>
</div>
<div class="am-say" id="amSay">▶️ 곧 시작해요…</div>
</div>
<p class="cap">↑ 로그는 언리얼 Print String처럼 <b>새 글이 맨 위</b>에 쌓여요.</p>
</section>

<section class="rsx" id="a6"><div class="rh"><span class="rn">06</span><span class="rk">BUILD</span><h3>블루프린트 만들기</h3></div>
<p>그림을 보면서 노드를 하나씩 연결했어요. 틀렸던 순간은 <b>BEFORE / AFTER</b>로 남겨 뒀어요. 버튼을 눌러 비교해 보세요.</p>

<div class="am-step am-rv"><div class="am-sh"><span class="am-no">STEP 1</span><b>시작 세팅 — 10 / 10으로 시작하기</b></div>
<p>기본값은 <code>MaxAmmo</code>에만 10을 줬어요. 게임이 시작되면 MaxAmmo를 <b>Get</b>해서 CurrentAmmo에 <b>Set</b>! 숫자 10을 직접 쓰지 않고 변수를 써서, 탄창 크기를 바꿀 때 <b>한 곳만</b> 고치면 돼요.</p>
<div class="am-ba" data-ba><div class="am-bat"><button class="on" data-b="0">BEFORE · 실행 선 없음</button><button data-b="1">AFTER · 연결 + 출력</button></div>
<div class="am-bav"><figure class="am-shot on" data-zoom><img src="img/ammo01/bp_begin_bug.png" alt="BeginPlay 실행 선이 연결되지 않은 블루프린트" loading="lazy"><figcaption>❌ BeginPlay ▷ 가 SET과 안 이어져서, 게임을 켜도 SET이 실행되지 않아요</figcaption></figure><figure class="am-shot" data-zoom><img src="img/ammo01/bp_begin_fix.png" alt="BeginPlay부터 Print String까지 연결된 블루프린트" loading="lazy"><figcaption>✅ BeginPlay → SET → Format Text → Print String</figcaption></figure></div></div>
<div class="am-pair"><figure class="am-shot" data-zoom><img src="img/ammo01/play_start.png" alt="CurrentAmmo 10 출력 화면" loading="lazy"></figure><div class="call">🎉 실행하자 <b>CurrentAmmo: 10</b>이 떴어요!<br>알려주지 않은 <code>Format Text</code>의 <code>{Count}</code>를 스스로 써서 숫자를 문장 안에 쏙 넣었어요.</div></div>
</div>

<div class="am-step am-rv"><div class="am-sh"><span class="am-no">STEP 2</span><b>발사 줄 — 좌클릭하면 1발씩</b></div>
<p><code>좌클릭</code> → <code>Branch (Current &gt; 0)</code> → True면 <code>SET (Current − 1)</code> → <code>Format Text</code> → <code>Print</code>. False는 <b>일부러 비워 뒀어요</b> — 하얀 선이 없으면 거기서 멈추니까요.</p>
<div class="am-ba" data-ba><div class="am-bat"><button class="on" data-b="0">BEFORE · Branch 없음</button><button data-b="1">AFTER · Branch 추가</button></div>
<div class="am-bav"><figure class="am-shot on" data-zoom><img src="img/ammo01/bp_fire_bug.png" alt="Branch 없이 바로 빼는 발사 블루프린트" loading="lazy"><figcaption>❌ 클릭하면 무조건 −1 → 0 다음에 −1, −2… 문지기가 없는 문이에요</figcaption></figure><figure class="am-shot" data-zoom><img src="img/ammo01/bp_fire_fix.png" alt="Branch로 총알을 검사하는 발사 블루프린트" loading="lazy"><figcaption>✅ Branch(Current &gt; 0)가 문지기 — 총알이 있을 때만 통과</figcaption></figure></div></div>
<div class="am-seqs"><div class="am-seq bad"><small>BEFORE · 12번 클릭</small><span style="--d:0s">2</span><span style="--d:.5s">1</span><span style="--d:1s">0</span><span class="x" style="--d:1.5s">−1 😱</span><span class="x" style="--d:2s">−2</span></div><div class="am-seq good"><small>AFTER · 12번 클릭</small><span style="--d:0s">2</span><span style="--d:.5s">1</span><span style="--d:1s">0</span><span class="o" style="--d:1.5s">0 🛡️</span><span class="o" style="--d:2s">0</span></div></div>
</div>

<div class="am-step am-rv"><div class="am-sh"><span class="am-no">STEP 3</span><b>재장전 줄 — 덜 찼을 때만 채우기</b></div>
<figure class="am-shot" data-zoom><img src="img/ammo01/bp_reload.png" alt="R키 재장전 블루프린트" loading="lazy"><figcaption>R → Branch(Current == Max) → False → SET(Current = Max) → “장전 완료” 출력</figcaption></figure>
<p>그림에서는 “<b>덜 찼어?</b>(<code>&lt;</code>)”라고 물었는데, 블루프린트에서는 “<b>꽉 찼어?</b>(<code>==</code>)”라고 거꾸로 물었어요. 질문을 반대로 했으니 장전도 <b>반대쪽(False)</b>에 붙였죠.</p>
<div class="am-cmp"><div><small>📋 그림</small><code>Current &lt; Max</code> ?<b>True</b>에서 장전</div><i>=</i><div><small>🧱 내 BP</small><code>Current == Max</code> ?<b>False</b>에서 장전</div></div>
<div class="call">🍚 “배고파?” → 응 → 밥 / “배불러?” → 아니 → 밥. 질문은 달라도 <b>결과는 같아요</b>. True 쪽엔 보너스로 <b>“이미 가득참!”</b> 출력도 붙였어요.</div>
</div>
</section>

<section class="rsx" id="a7"><div class="rh"><span class="rn">07</span><span class="rk">DEBUG</span><h3>실수 · 해결</h3></div>
<div class="am-score am-rv"><div><small>발견한 버그</small><b data-count="4">0</b></div><i>→</i><div class="ok"><small>해결한 버그</small><b data-count="4">0</b></div><p>그림 단계에서 2개, 블루프린트 단계에서 2개를 잡았어요.</p></div>

.am-tryr{display:flex;flex-direction:column;gap:8px}
.am-btns{display:flex;gap:8px}
.am-btns .btn{font:inherit;font-size:13.5px}
.am-btns .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.am-tryr .am-logb{flex:1;background:#2f2745;border:1.4px solid var(--ink);border-radius:12px;min-height:110px}
.am-lvl{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:"IBM Plex Mono";font-size:11px}
.am-lvl div{flex:1;height:10px;border-radius:999px;border:1.4px solid var(--ink);background:#fff;overflow:hidden}
.am-lvl i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc8dd,#dccbf7,#bfe3ff);transition:width 1.6s cubic-bezier(.3,1,.5,1) .2s}
.am-lvl.in i{width:100%}
.am-lvl b{font-weight:500;color:#e07aa3}
</style>
<script>
(function(){
  const MAX=10;let T=[],IO=null;
  const stop=()=>{T.forEach(clearInterval);T=[];if(IO){IO.disconnect();IO=null}};
  const every=(fn,ms)=>{const t=setInterval(fn,ms);T.push(t);return t};
  // HUD: 총알 칸 10개 그리기
  function hud(h,n,act,msg){
    if(!h)return;const P=h.querySelector('.am-pips');
    if(!P.children.length)for(let i=0;i<MAX;i++)P.appendChild(document.createElement('i'));
    [...P.children].forEach((p,i)=>{const was=p.classList.contains('off'),off=i>=n;p.classList.toggle('off',off);
      if(was&&!off&&act==='reload'){p.classList.remove('new');void p.offsetWidth;p.classList.add('new');p.style.animationDelay=(i*.04)+'s'}});
    const num=h.querySelector('.am-num');num.textContent=n;
    h.classList.remove('fire','empty','reload','full');
    if(act){void h.offsetWidth;h.classList.add(act)}
    if(msg!==undefined)h.querySelector('.am-act').textContent=msg;
  }
  function logTo(box,txt,max){if(!box)return;const m=box.querySelector('.mu');if(m)m.remove();
    const d=document.createElement('div');d.textContent=txt;box.prepend(d);while(box.children.length>(max||8))box.lastChild.remove()}

  // (1) 첫 장 HUD: 쏘고 → 비고 → 재장전, 반복 (2장 변수 상자도 같이 움직여요)
  function hero(root){
    const h=root.querySelector('[data-hud=hero]');let n=MAX,st=0,w=0;
    const sync=()=>{root.querySelectorAll('[data-sync=num]').forEach(e=>e.textContent=n);root.querySelectorAll('[data-sync=fill]').forEach(e=>e.style.width=(n*10)+'%')};
    hud(h,n,null,'READY');sync();
    every(()=>{if(!h.isConnected)return stop();if(w>0){w--;return}
      if(n>0){n--;hud(h,n,'fire','💥 탕!  Current − 1')}
      else if(st===0){hud(h,0,'empty','⛔ 0 > 0 ? 거짓 → 안 쏴짐');st=1;w=3}
      else{n=MAX;hud(h,n,'reload','🔄 R · Current = Max');st=0;w=4}
      sync()},520);
  }

  // (2) 5장 자동 재생
  function sim(root){
    const S=root.querySelector('#amSim');if(!S)return;
    const nodes=[...S.querySelectorAll('[data-n]')],h=S.querySelector('[data-hud=sim]'),L=S.querySelector('#amLog'),say=S.querySelector('#amSay'),st=S.querySelector('#amStep');
    const steps=[];let c=MAX;const P=(n,s,o)=>steps.push(Object.assign({n:[].concat(n),s},o||{}));
    P('b0','▶️ 게임 시작! BeginPlay가 실행돼요',{lab:'시작 세팅',reset:1});
    P('b1','🔄 MaxAmmo(10)를 가져와서 CurrentAmmo에 넣기',{cur:MAX,act:'reload',msg:'Current = Max'});
    P('b2','🖨️ 화면에 출력',{log:'CurrentAmmo: 10 / 10'});
    const click=fast=>{
      if(c>0){const b=c;c--;
        if(fast)P(['f0','f1','f2','f3'],'💥 탕! '+b+' → '+c,{cur:c,act:'fire',msg:'💥 탕!',log:'CurrentAmmo: '+c+' / 10',lab:'연사'});
        else{P('f0','🖱️ 좌클릭!',{lab:'발사'});P('f1','❓ '+b+' > 0 ? → 참 ✅ 통과');P('f2','➖ '+b+' − 1 = '+c,{cur:c,act:'fire',msg:'💥 탕!'});P('f3','🖨️ 출력',{log:'CurrentAmmo: '+c+' / 10'})}}
      else{P('f0','🖱️ 빈 탄창에서 좌클릭!',{lab:'빈 탄창'});P('f1','❓ 0 > 0 ? → 거짓 ❌');P('fx','⛔ False엔 선이 없어서 멈춤 — 음수로 안 내려가요!',{cur:0,act:'empty',msg:'⛔ 안 쏴짐'})}};
    const reload=()=>{P('r0','⌨️ R키!',{lab:'재장전'});
      if(c===MAX){P('r1','❓ 10 == 10 ? → 참 (꽉 참)');P('r4','🖨️ 이미 가득참! — 장전 안 해요',{act:'full',msg:'이미 가득참',log:'이미 가득참!'})}
      else{P('r1','❓ '+c+' == 10 ? → 거짓 (덜 참)');c=MAX;P('r2','🔄 CurrentAmmo = MaxAmmo → 10',{cur:MAX,act:'reload',msg:'🔄 재장전'});P('r3','🖨️ 장전 완료',{log:'장전 완료 · CurrentAmmo: 10 / 10'})}};
    click();click();click();reload();reload();for(let i=0;i<MAX;i++)click(true);click();reload();
    let k=0,w=0;
    function tick(){
      if(!S.isConnected)return stop();
      if(w>0){w--;if(!w)k=0;return}
      const s=steps[k];
      if(s.reset){L.innerHTML='';hud(h,0,null,'—')}
      nodes.forEach(e=>e.classList.toggle('hot',s.n.includes(e.dataset.n)));
      S.querySelectorAll('.am-lane').forEach(l=>l.classList.toggle('act',!!l.querySelector('.hot')));
      if(s.lab)st.textContent=s.lab;
      if(s.cur!==undefined||s.act)hud(h,s.cur!==undefined?s.cur:+h.querySelector('.am-num').textContent,s.act,s.msg);
      if(s.log)logTo(L,s.log,7);
      say.textContent=s.s;say.classList.remove('pop');void say.offsetWidth;say.classList.add('pop');
      k++;if(k>=steps.length){w=5;st.textContent='🏁 끝 · 다시 재생'}
    }
    hud(h,0,null,'—');every(tick,760);
  }

  // (3) 8장 직접 해보기
  let tc=MAX;
  function tryInit(root){tc=MAX;hud(root.querySelector('[data-hud=try]'),tc,null,'READY')}
  function tryAct(k){
    const h=document.querySelector('#mbd [data-hud=try]'),L=document.querySelector('#mbd #amTryLog');if(!h)return;
    if(k==='fire'){if(tc>0){tc--;hud(h,tc,'fire','💥 탕!');logTo(L,'CurrentAmmo: '+tc+' / 10')}else{hud(h,0,'empty','⛔ 0 > 0 ? 거짓');logTo(L,'(False → 멈춤 · 출력 없음)')}}
    else{if(tc===MAX){hud(h,tc,'full','이미 가득참');logTo(L,'이미 가득참!')}else{tc=MAX;hud(h,tc,'reload','🔄 재장전');logTo(L,'장전 완료 · CurrentAmmo: 10 / 10')}}
  }

  // (4) 스크롤하면 나타나기 + 숫자 세기
  function reveal(root){
    const els=[...root.querySelectorAll('.am-rv')];
    const on=e=>{if(e.classList.contains('in'))return;e.classList.add('in');
      e.querySelectorAll('[data-count]').forEach(b=>{let v=0;const to=+b.dataset.count;const t=setInterval(()=>{b.textContent=++v;if(v>=to)clearInterval(t)},220)})};
    if(!('IntersectionObserver' in window)){els.forEach(on);return}
    IO=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)on(x.target)}),{root,threshold:.12});
    els.forEach(e=>IO.observe(e));
  }

  // 클릭: 전/후 비교 · 확대 · 직접 해보기
  let lb=null;
  document.addEventListener('click',e=>{
    const b=e.target.closest('.am-bat button');
    if(b){const w=b.closest('[data-ba]');w.querySelectorAll('.am-bat button').forEach(x=>x.classList.toggle('on',x===b));
      w.querySelectorAll('.am-bav .am-shot').forEach((f,i)=>f.classList.toggle('on',i==b.dataset.b));return}
    const z=e.target.closest('#mbd [data-zoom]');
    if(z){if(!lb){lb=document.createElement('div');lb.className='am-lb';lb.innerHTML='<img alt="">';document.body.appendChild(lb);lb.addEventListener('click',()=>lb.classList.remove('show'))}
      const im=z.querySelector('img');lb.firstChild.src=im.src;lb.firstChild.alt=im.alt;requestAnimationFrame(()=>lb.classList.add('show'));return}
    const t=e.target.closest('[data-try]');if(t)tryAct(t.dataset.try);
  });
  addEventListener('keydown',e=>{if(e.key==='Escape'&&lb&&lb.classList.contains('show')){lb.classList.remove('show');e.stopImmediatePropagation()}},true);

  const mbd=document.getElementById('mbd');
  new MutationObserver(()=>{const r=mbd.querySelector('[data-anim="ammo01"]');stop();if(r){hero(r);sim(r);tryInit(r);reveal(r)}}).observe(mbd,{childList:true});
})();
</script>
</body></html>
